{% include base_path %}

<!-- Font Awesome CSS -->
<link 
  id="fa-stylesheet" 
  rel="stylesheet" 
  href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css"
>

<!-- Site Footer -->
<footer class="site-footer h-card">
  <data class="u-url" value="{{ base_path }}"></data>
  
  <div class="wrapper">
    <div class="footer-col">
      <!-- Copyright Information -->
      <div class="footer-copyright">
        <p class="copyright-text">
          &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}
        </p>
        <p class="last-updated">
          Site last updated: {{ "now" | date: '%Y-%m-%d' }}
        </p>
      </div>

      <!-- Social Media Links -->
      <div class="social-links">
        {%- include social.html -%}
      </div>
    </div>
  </div>
</footer>
