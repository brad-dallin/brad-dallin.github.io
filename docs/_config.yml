# Site Configuration File
#
# Site settings
title: Laptop Chemistry
description: >-
  "My digital workspace for computational chemistry research,
  cheminformatics tools, and scientific computing projects.
  Sharing thoughts on methods, discoveries, and open source
  contributions that catch my attention in the world of scientific
  computing."
baseurl: ""
url: "https://brad-dallin.github.io"


# Author settings
author: 
  name: "Brad Dallin"
  email: bradley.dallin.phd@gmail.com
  contact:
    - title: Mail
      icon: "fa-solid fa-envelope"
      url: "mailto:bradley.dallin.phd@gmail.com"
    - title: GitHub
      icon: "fa-brands fa-github"
      url: "https://github.com/brad-dallin"
    - title: LinkedIn
      icon: "fa-brands fa-linkedin"
      url: "https://www.linkedin.com/in/bradley-dallin/"

# Build settings
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag


# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

