# Jekyll Configuration

# Site settings
title: Laptop Chemistry
email: bradley.dallin.phd@gmail.com
description: >-
  My digital workspace for computational chemistry research,
  cheminformatics tools, and scientific computing projects.
  Sharing thoughts on methods, discoveries, and open source
  contributions that catch my attention in the world of scientific
  computing.
baseurl: ""
url: "https://brad-dallin.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username:
github_username:  brad-dallin

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# GitHub Pages
lsi: false
# safe: true
# source: docs
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
